<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 48">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="logo-wave" x1="10" y1="36" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .logo-text-title { fill: #0f172a; }
      .logo-text-sub { fill: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        .logo-text-title { fill: #f8fafc; }
        .logo-text-sub { fill: #818cf8; }
      }
      [data-theme="dark"] .logo-text-title { fill: #f8fafc; }
      [data-theme="dark"] .logo-text-sub { fill: #818cf8; }
    </style>
  </defs>
  <!-- Icon container -->
  <rect width="48" height="48" rx="12" fill="url(#logo-bg)"/>
  <!-- Subtly aligned network grid -->
  <path d="M12 14v20M24 14v20M36 14v20M12 14h24M12 24h24M12 34h24" fill="none" stroke="#a5b4fc" stroke-width="0.8" opacity="0.25"/>
  <g fill="#c7d2fe" opacity="0.6">
    <circle cx="12" cy="14" r="1.6"/>
    <circle cx="24" cy="14" r="1.6"/>
    <circle cx="36" cy="24" r="1.6"/>
    <circle cx="12" cy="24" r="1.6"/>
    <circle cx="24" cy="34" r="1.6"/>
    <circle cx="36" cy="34" r="1.6"/>
  </g>
  <!-- Signal wave curve -->
  <path d="M11 34c6.2 0 6.2-10 12.8-10.5 6.6-.5 5.8-10.5 13.2-10.5" fill="none" stroke="url(#logo-wave)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="11" cy="34" r="2.4" fill="#ffffff"/>
  <circle cx="23.8" cy="23.5" r="2.4" fill="#ffffff"/>
  <circle cx="37" cy="13" r="3.2" fill="#38bdf8"/>
  <!-- Typography matching theme variables via classes -->
  <text x="64" y="30" class="logo-text-title" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750" letter-spacing="-0.5">NLP</text>
  <text x="101" y="30" class="logo-text-sub" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" letter-spacing="0.2">VISUAL LAB</text>
</svg>
